name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Los tests sólo ejercitan lib/core.js y la lógica de decisión del ayudante
      # de BitLocker (PowerShell, sin elevación), así que se salta la descarga
      # del binario de Electron (--ignore-scripts).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test
